<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Interactive Textbook</title>
    <!--
      Apply the saved presentation before the first paint, so a reload never
      flashes the wrong theme. Deliberately does NOT read prefers-color-scheme:
      Observatory is an explicit choice, not an OS dark mode. Keep the key and
      the default in sync with src/platform/theme.ts.
    -->
    <script>
      (function () {
        var fallback = "notebook";
        var saved = null;
        try {
          saved = localStorage.getItem("technical-learning/theme/v1");
        } catch (error) {
          saved = null;
        }
        var theme =
          saved === "notebook" || saved === "observatory" ? saved : fallback;
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
