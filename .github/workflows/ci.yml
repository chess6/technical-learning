name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # A developer machine reaches the suite with node_modules/.vite already
      # populated; a fresh `npm ci` does not. Pre-bundling here moves that cost
      # out of the first tests, which would otherwise pay it inside their own
      # per-test timeout.
      - name: Prime Vite dependency cache
        run: npx vite optimize

      - name: E2E tests
        run: npm run test:e2e

      # Without this a failing e2e job reports only "failure" — no report, no
      # trace, nothing to diagnose from. Traces are retained on failure (see
      # playwright.config.ts), so this makes the next red run explainable.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
